apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx1
  namespace: demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx1

  template:
    metadata:
      labels:
        app: nginx1

    spec:
      containers:
      - name: nginx1
        image: nginx:1.26
        ports:
        - containerPort: 80
